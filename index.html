<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f1923">
<title>🧪 TEST 運転日報</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f5f5}
#appFrame{border:0;width:100%;height:100%;display:block;background:#f5f5f5}
</style>
</head>
<body>
<iframe id="appFrame" src="app-v7.html" title="TEST 運転日報"></iframe>
<script>
(function(){
  var frame=document.getElementById('appFrame');

  frame.addEventListener('load',function(){
    var w=frame.contentWindow,d=frame.contentDocument;
    if(!w||!d)return;

    /* ===== 仕事内容メモ：見た目＋ON/OFFトグル ===== */
    var style=d.createElement('style');
    style.textContent=`
      .memo-btn{
        border:1.5px solid var(--border)!important;
        background:var(--surface2)!important;
        color:var(--text)!important;
      }
      .memo-btn.memo-selected{
        border-color:var(--accent)!important;
        background:rgba(232,96,28,.10)!important;
        color:var(--accent)!important;
      }
      #memoCustomerBtn{border-color:var(--border)!important;background:var(--surface2)!important;color:var(--text)!important}
    `;
    d.head.appendChild(style);

    var memoArea=d.querySelector('#inputJobAccordion .memo-btn');
    if(memoArea){
      var wrap=memoArea.parentElement;
      var buttons=Array.from(wrap.querySelectorAll('.memo-btn'));

      function find(txt){
        return buttons.find(function(b){return b.textContent.trim().indexOf(txt)>=0;});
      }
      var gas=find('ガス');
      var ester=find('エステル');
      var chlorine=find('塩素');
      var load=find('搭載');
      var chlorineOnly=find('塩素搭載のみ');
      var chlorineDelivery=find('塩素搭載＋配送');
      var environment=find('環境整備');
      var kaneka=find('カネカ');
      var pm=find('PM搭載');
      var customer=find('客先');

      if(chlorine)chlorine.remove();
      if(load)load.remove();

      function hasMemo(parts){
        var el=d.getElementById('jobMemo');
        if(!el)return false;
        var raw=String(el.value||'');
        return parts.every(function(p){return raw.indexOf(p)>=0;});
      }
      function refresh(){
        if(gas)gas.classList.toggle('memo-selected',hasMemo(['ガス']));
        if(ester)ester.classList.toggle('memo-selected',hasMemo(['エステル','搭載']));
        if(chlorineOnly)chlorineOnly.classList.toggle('memo-selected',
          (Array.isArray(w.selectedJobs)&&w.selectedJobs.includes('塩素搭載のみ')) || hasMemo(['塩素','搭載']));
        if(chlorineDelivery)chlorineDelivery.classList.toggle('memo-selected',
          Array.isArray(w.selectedJobs)&&w.selectedJobs.includes('塩素搭載＋配送'));
        if(environment)environment.classList.toggle('memo-selected',
          (Array.isArray(w.selectedJobs)&&w.selectedJobs.includes('環境整備')) || hasMemo(['環境整備']));
        if(kaneka)kaneka.classList.toggle('memo-selected',hasMemo(['㈱カネカ 大阪']));
        if(pm)pm.classList.toggle('memo-selected',hasMemo(['PM搭載']));
      }
      function afterChange(){
        if(typeof w.updateJobAvailability==='function')w.updateJobAvailability();
        if(typeof w.autoCalcOvertime==='function')w.autoCalcOvertime();
        if(typeof w.updateInputProgress==='function')w.updateInputProgress();
        refresh();
        setTimeout(function(){
          refresh();
          syncAutoToxic();
        },0);
      }
      function getCurrentToxic(){
        var b1=d.getElementById('toxicBtn1');
        var b2=d.getElementById('toxicBtn2');
        if(b2&&b2.classList.contains('selected'))return 2;
        if(b1&&b1.classList.contains('selected'))return 1;
        return 0;
      }

      function forceToxic(n){
        n=Math.max(0,Math.min(2,Number(n)||0));
        var current=getCurrentToxic();
        if(current===n)return;

        /*
          selectToxic() は「同じ数を押すと解除」のトグル関数。
          そのため一度現在値を確実に解除してから、必要値を選択する。
        */
        if(current===1&&typeof w.selectToxic==='function')w.selectToxic(1);
        else if(current===2&&typeof w.selectToxic==='function')w.selectToxic(2);

        if(n===1&&typeof w.selectToxic==='function')w.selectToxic(1);
        else if(n===2&&typeof w.selectToxic==='function')w.selectToxic(2);

        if(typeof w.updateInputProgress==='function')w.updateInputProgress();
      }

      function memoText(){
        var el=d.getElementById('jobMemo');
        return el?String(el.value||''):'';
      }

      function isKanekaOn(){
        var txt=memoText();
        return !!(
          (kaneka&&kaneka.classList.contains('memo-selected')) ||
          txt.indexOf('㈱カネカ 大阪')>=0 ||
          txt.indexOf('カネカ 大阪')>=0
        );
      }

      function isPmOn(){
        var txt=memoText();
        return !!(
          (pm&&pm.classList.contains('memo-selected')) ||
          txt.indexOf('PM搭載')>=0
        );
      }

      function syncAutoToxic(){
        var k=isKanekaOn();
        var p=isPmOn();

        if(k||p){
          w.__memoAutoToxicActive=true;
          forceToxic((k?1:0)+(p?1:0));
        }else if(w.__memoAutoToxicActive){
          /*
            カネカ/PMによって自動付与した毒手当だけを解除する。
            これにより、カネカ解除時に毒×1が残らない。
          */
          forceToxic(0);
          w.__memoAutoToxicActive=false;
        }
      }

      function toggleSimple(btn,parts,onFn,offFn){
        btn.onclick=function(){
          var active=btn.classList.contains('memo-selected');
          if(active){
            offFn();
          }else{
            onFn();
          }
          afterChange();
        };
      }

      if(gas){
        gas.id='memoGasBtn';
        gas.innerHTML='⛽ ガス';
        toggleSimple(gas,['ガス'],
          function(){w.addMemo('ガス');},
          function(){w.removeMemo('ガス');}
        );
      }

      if(ester){
        ester.id='memoEsterBtn';
        ester.innerHTML='🧪 エステル搭載';
        toggleSimple(ester,['エステル','搭載'],
          function(){w.addMemo('エステル');w.addMemo('搭載');},
          function(){w.removeMemo('エステル');w.removeMemo('搭載');}
        );
      }

      if(chlorineOnly){
        chlorineOnly.id='memoChlorineBtn';
        chlorineOnly.removeAttribute('style');
        chlorineOnly.innerHTML='⚗️ 塩素搭載';
        toggleSimple(chlorineOnly,['塩素','搭載'],
          function(){w.setChlorineOnlyTask();},
          function(){
            w.removeMemo('塩素');w.removeMemo('搭載');
            if(Array.isArray(w.selectedJobs)){
              w.selectedJobs=w.selectedJobs.filter(function(j){return j!=='塩素搭載のみ';});
            }
            if(typeof w.clearAutoZeroDistance==='function')w.clearAutoZeroDistance();
          }
        );
      }

      if(chlorineDelivery){
        chlorineDelivery.id='memoChlorineDeliveryBtn';
        chlorineDelivery.removeAttribute('style');
        chlorineDelivery.innerHTML='🚛 塩素搭載＋配送';
        toggleSimple(chlorineDelivery,['塩素','搭載','配送'],
          function(){w.setChlorineDeliveryTask();},
          function(){
            w.removeMemo('塩素');w.removeMemo('搭載');w.removeMemo('配送');
            if(Array.isArray(w.selectedJobs)){
              w.selectedJobs=w.selectedJobs.filter(function(j){return j!=='塩素搭載＋配送';});
            }
          }
        );
      }

      if(environment){
        environment.id='memoEnvironmentBtn';
        environment.removeAttribute('style');
        environment.innerHTML='🧹 環境整備';
        toggleSimple(environment,['環境整備'],
          function(){
            w.setEnvironmentTask();
            var el=d.getElementById('jobMemo');
            if(el)el.value=String(el.value||'').replace(/環境整備（雑用）/g,'環境整備');
          },
          function(){
            w.removeMemo('環境整備');
            w.removeMemo('環境整備（雑用）');
            if(Array.isArray(w.selectedJobs)){
              w.selectedJobs=w.selectedJobs.filter(function(j){return j!=='環境整備';});
            }
            if(typeof w.clearAutoZeroDistance==='function')w.clearAutoZeroDistance();
          }
        );
      }

      if(pm){
        pm.id='memoPmBtn';
        pm.innerHTML='☠️ PM搭載';
        toggleSimple(pm,['PM搭載'],
          function(){
            w.addMemo('PM搭載');
            pm.classList.add('memo-selected');
            setTimeout(function(){
              refresh();
              syncAutoToxic();
            },0);
          },
          function(){
            w.removeMemo('PM搭載');
            pm.classList.remove('memo-selected');
            setTimeout(function(){
              refresh();
              syncAutoToxic();
            },0);
          }
        );
      }

      if(kaneka){
        kaneka.id='memoKanekaBtn';
        kaneka.innerHTML='🏭 カネカ';
        toggleSimple(kaneka,['㈱カネカ 大阪'],
          function(){
            w.addMemo('㈱カネカ 大阪');
            kaneka.classList.add('memo-selected');
            setTimeout(function(){
              refresh();
              syncAutoToxic();
            },0);
          },
          function(){
            w.removeMemo('㈱カネカ 大阪');
            w.removeMemo('カネカ 大阪');
            kaneka.classList.remove('memo-selected');
            setTimeout(function(){
              refresh();
              syncAutoToxic();
            },0);
          }
        );
      }

      if(customer){
        customer.id='memoCustomerBtn';
        customer.removeAttribute('style');
        customer.innerHTML='📋 客先';
      }

      [gas,ester,chlorineOnly,chlorineDelivery,environment,pm,kaneka,customer].filter(Boolean)
        .forEach(function(b){wrap.appendChild(b);});

      var memo=d.getElementById('jobMemo');
      if(memo){
        memo.addEventListener('input',refresh);
        memo.addEventListener('change',refresh);
      }
      setTimeout(function(){
        refresh();
        if(isKanekaOn()||isPmOn()){
          syncAutoToxic();
        }
      },0);
    }

    /* ===== 会社公式 時間外早見表 ===== */
    if(!d.getElementById('overtimeReferenceBtn')){
      var s=d.createElement('style');
      s.textContent=`
      .ot-ref-btn{width:100%;background:rgba(52,152,219,.12);border:1.5px solid var(--blue);border-radius:10px;padding:11px 12px;color:var(--blue);font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}
      .ot-ref-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:1200;align-items:flex-end;justify-content:center}
      .ot-ref-overlay.open{display:flex}.ot-ref-modal{background:var(--surface);width:100%;height:94vh;border-radius:18px 18px 0 0;overflow:hidden;display:flex;flex-direction:column;border-top:2px solid var(--blue)}
      .ot-ref-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);flex:none}
      .ot-ref-head-title{font-weight:700;color:var(--blue);font-size:16px}.ot-ref-close{border:0;background:var(--surface2);border-radius:9px;padding:8px 12px;font-size:16px;color:var(--text)}
      .ot-ref-body{padding:12px;overflow:auto;-webkit-overflow-scrolling:touch}.ot-ref-note{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:10px}
      .ot-ref-group{margin-bottom:18px}.ot-ref-group-title{font-size:13px;font-weight:700;margin-bottom:7px;color:var(--text)}
      .ot-ref-scroll{overflow:auto;border:1px solid var(--border);border-radius:10px;background:#fff}.ot-ref-table{border-collapse:collapse;min-width:760px;width:max-content;font-size:10px;color:#111;background:#fff}
      .ot-ref-table th,.ot-ref-table td{border:1px solid #aaa;padding:4px 5px;text-align:center;white-space:nowrap}.ot-ref-table thead th{background:#f1f3f5;font-weight:700}
      .ot-ref-table .start{position:sticky;left:0;background:#fff;font-weight:700;z-index:1}.ot-ref-table .break,.ot-ref-table .limit{background:#fff3cd}
      .ot-ref-legend{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.5}`;
      d.head.appendChild(s);

      var otCard=d.querySelector('.time-card-ot');
      if(otCard){
        var btn=d.createElement('button');
        btn.type='button'; btn.id='overtimeReferenceBtn'; btn.className='ot-ref-btn';
        btn.textContent='📋 会社の時間外早見表を見る';
        otCard.insertBefore(btn,d.getElementById('overtimeModeNote')||null);

        var overlay=d.createElement('div');
        overlay.id='overtimeReferenceOverlay'; overlay.className='ot-ref-overlay';
        overlay.innerHTML='<div class="ot-ref-modal" onclick="event.stopPropagation()"><div class="ot-ref-head"><div class="ot-ref-head-title">📋 会社公式 時間外早見表</div><button type="button" class="ot-ref-close" id="overtimeReferenceClose">✕ 閉じる</button></div><div class="ot-ref-body"><div class="ot-ref-note">会社資料の4区分をスマホで見やすい表にしています。横にスクロールできます。</div><div id="overtimeReferenceTables"></div></div></div>';
        d.body.appendChild(overlay);

        function mins(v){var p=v.split(':');return parseInt(p[0],10)*60+parseInt(p[1],10);}
        function fmt(m){m=(m+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
        function otHours(start,baseStart,stdEnd,end){
          var st=mins(start),b=mins(baseStart),std=mins(stdEnd),e=mins(end);if(e<st)e+=1440;
          var early=Math.max(0,b-st),post=Math.max(0,e-std);
          early=Math.floor(early/15)*15;post=Math.floor(post/15)*15;
          var credited=post;if(post>240&&post<=270)credited=240;else if(post>270)credited=post-30;
          return Math.max(0,Math.round(((early+credited)/60)*4)/4);
        }
        function num(v){return v%1===0?String(v):String(v.toFixed(2)).replace(/0+$/,'').replace(/\.$/,'');}
        function buildGroup(title,starts,baseStart,stdEnd,endStart,endFinish){
          var ends=[],m=mins(endStart),last=mins(endFinish);if(last<m)last+=1440;
          for(;m<=last;m+=15)ends.push(fmt(m));
          var h='<div class="ot-ref-group"><div class="ot-ref-group-title">'+title+' 【定時の退勤時間は'+stdEnd+'】</div><div class="ot-ref-scroll"><table class="ot-ref-table"><thead><tr><th class="start">出勤\\退勤</th>';
          ends.forEach(function(e){h+='<th>'+e+'</th>';});h+='</tr></thead><tbody>';
          starts.forEach(function(st){
            h+='<tr><th class="start">'+st+'</th>';
            ends.forEach(function(e){
              var em=mins(e);if(em<mins(st))em+=1440;
              var post=Math.max(0,em-mins(stdEnd));
              var fifteen=(em-mins(st))===900;
              var cls=(post>240&&post<=270)?'break':(fifteen?'limit':'');
              h+='<td class="'+cls+'">'+num(otHours(st,baseStart,stdEnd,e))+'</td>';
            });
            h+='</tr>';
          });
          h+='</tbody></table></div><div class="ot-ref-legend">黄色：定時後4時間を超えた30分休憩帯、または出勤から15時間の目安。早出は定時後4時間の休憩判定には含めません。</div></div>';
          return h;
        }
        var tableHtml='';
        tableHtml+=buildGroup('4:30〜6:00出勤の時間外早見表',['4:30','5:00','5:30','6:00'],'6:00','14:15','14:15','21:00');
        tableHtml+=buildGroup('7:00〜8:00出勤の時間外早見表',['7:00','7:30','8:00'],'8:00','16:15','16:15','23:00');
        tableHtml+=buildGroup('9:00〜10:00出勤の時間外早見表',['9:00','10:00'],'10:00','18:15','18:15','01:00');
        tableHtml+=buildGroup('12:00〜13:00出勤の時間外早見表',['12:00','13:00'],'13:00','21:15','21:15','04:00');
        d.getElementById('overtimeReferenceTables').innerHTML=tableHtml;

        function openRef(){overlay.classList.add('open');d.body.style.overflow='hidden';}
        function closeRef(){overlay.classList.remove('open');d.body.style.overflow='';}
        btn.addEventListener('click',openRef);
        d.getElementById('overtimeReferenceClose').addEventListener('click',closeRef);
        overlay.addEventListener('click',function(e){if(e.target===overlay)closeRef();});
      }
    }
  });
})();
</script>

<!--
変更履歴
- 2026/09/01 TEST v4：カネカ/PM搭載の毒手当連動を中央再計算方式へ変更
- カネカON＝毒×1、PM搭載ON＝毒×1、両方ON＝毒×2として毎回再計算
- 長距離＋カネカ＋PM搭載で毒×2にならない不具合を修正
- カネカ解除時、PM搭載もOFFなら自動付与した毒×1を確実に解除
- カネカ解除時にPM搭載が残っていれば毒×1を維持
- PM搭載解除時にカネカが残っていれば毒×1へ戻す
- 本体selectToxic()の「同じ値を再選択すると解除される」トグル仕様を考慮し、現在値を確認してから確実に目的値へ変更
- 手動で付けた毒手当を不用意に消さないよう、自動付与中フラグを追加
- 2026/09/01 TEST再修正：カネカ・PM搭載の毒手当連動を根本修正
- 原因：カネカ長距離では本体側で毒×1が先に付くため、その直後にselectToxic(1)を呼ぶとトグル動作で逆に解除されていた
- 現在の毒手当選択状態を確認してから必要な値へ強制設定するforceToxic()を追加
- カネカON → 必ず毒×1（PM搭載済みなら×2）
- PM搭載ON → カネカありなら必ず毒×2、カネカなしなら必ず毒×1
- PM搭載OFF → カネカありなら毒×1、カネカなしなら毒なし
- カネカOFF → PM搭載ありなら毒×1、PM搭載なしなら毒なし
- 2026/09/01 TEST：毒手当の自動連動ルールを改善
- カネカ選択時は毒手当×1を自動選択
- カネカ選択中にPM搭載を選ぶと毒手当×1→×2へ自動変更
- カネカ未選択でPM搭載を選ぶと毒手当×1を自動選択
- PM搭載解除時：カネカが残っていれば毒×1、カネカも無ければ毒手当なしへ自動変更
- カネカ解除時：PM搭載が残っていれば毒×1、PM搭載も無ければ毒手当なしへ自動変更
- 2026/09/01 TEST：仕事内容メモボタンをON/OFFトグル方式へ変更
- 未選択ボタンの色付き縁取りを廃止し、選択中のみオレンジ縁取りを表示
- 再タップで選択解除し、仕事内容メモ欄から対応文字も削除
- PM搭載を解除したとき毒手当×2を自動解除し、通常の毒手当×1へ復帰
- 「塩素」「搭載」単独ボタンを削除
- 「エステル」→「エステル搭載」、「塩素搭載のみ」→「塩素搭載」、「環境整備（雑用）」→「環境整備」
- 並び順：ガス / エステル搭載 / 塩素搭載 / 塩素搭載＋配送 / 環境整備 / PM搭載 / カネカ / 客先
- 会社公式時間外早見表を維持
- TEST本体 app-v7.html の既存機能・本番データ分離を維持
-->
</body>
</html>
